<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap">
<style>
:root{--bg:#8fd3ff;--fg:#10283a;--card:#ffffff;--gold:#ffb703;--line:#c9dbe8;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#12303f;--fg:#eaf4f8;--line:#2b5266}}
:root[data-theme="dark"]{--card:#12303f;--fg:#eaf4f8;--line:#2b5266}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;color:var(--fg);user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 0;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#prog{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);height:10px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden;pointer-events:none}
#pb{display:block;height:100%;width:0;background:var(--gold)}
#pop{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:56px;font-weight:800;pointer-events:none;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#pop.good{color:#7dffa8;animation:pp .7s ease-out}
#pop.bad{color:#ff8a80;animation:pp .7s ease-out}
@keyframes pp{0%{opacity:1;transform:scale(.6)}30%{transform:scale(1.15)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,30,46,.55);padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px);overflow:hidden}
.card{background:var(--card);border-radius:22px;padding:14px;width:min(420px,100%);flex-shrink:0;transform-origin:center;display:flex;flex-direction:column;gap:8px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.card h1{margin:0;font-size:26px}
.card p{margin:0;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:800}
.shop{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:4px 10px;text-align:start;font-size:15px}
.it span.e{font-size:24px}.it div{flex:1;line-height:1.3}.it small{opacity:.75}
.buy{border:0;background:#1f9d55;color:#fff;border-radius:10px;padding:6px 12px;font-weight:800}
.buy:disabled{background:var(--line);color:inherit;opacity:.6;cursor:not-allowed}
#go{border:0;background:var(--gold);color:#1a1a1a;font-weight:800;font-size:22px;border-radius:14px;padding:12px}
button:focus-visible{outline:3px solid #1f6feb;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="lv"></span><span id="mo"></span></div>
<div id="prog"><i id="pb"></i></div>
<div id="pop"></div>
<div id="ov"><div class="card" id="card"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const T={
 ar:{title:"جري الفلوس",tag:"اجمع الفلوس، اختار البوابة الصح، وكبّر مشاريعك.",play:"ابدأ",next:"المستوى التالي",lvl:"المستوى",bank:"رصيدك",done:"عدّيت خط النهاية!",earned:"جمعت",bonus:"بونص المصنع",lang:"اللغة",cur:"العملة",shop:"المشاريع",fin:"النهاية",buy:"ترقية",lv:"م",
  it:[["🏪","كشك","+١٠٠ فلوس بداية"],["☕","كافيه","+٥ قيمة كل عملة"],["🏭","مصنع","+٢٥٪ بونص عند النهاية"]],
  cn:{egp:"جنيه",usd:"دولار",eur:"يورو",sar:"ريال",kwd:"دينار",gem:"جوهرة"},hint:"حرّك صباعك أو الماوس يمين وشمال"},
 en:{title:"Money Run",tag:"Grab coins, pick the right gates, and grow your businesses.",play:"Play",next:"Next level",lvl:"Level",bank:"Balance",done:"You crossed the finish line!",earned:"Collected",bonus:"Factory bonus",lang:"Language",cur:"Currency",shop:"Businesses",fin:"FINISH",buy:"Upgrade",lv:"Lv",
  it:[["🏪","Kiosk","+100 starting cash"],["☕","Cafe","+5 per coin"],["🏭","Factory","+25% finish bonus"]],
  cn:{egp:"Pound",usd:"Dollar",eur:"Euro",sar:"Riyal",kwd:"Dinar",gem:"Gem"},hint:"Drag or move the mouse left and right"}};
const CUR={egp:{s:"ج.م",g:"ج",c:"#f2b705"},usd:{s:"$",g:"$",c:"#6fcf7a"},eur:{s:"€",g:"€",c:"#8fb3ff"},sar:{s:"ر.س",g:"ر",c:"#e9c46a"},kwd:{s:"د.ك",g:"د",c:"#d9a066"},gem:{s:"💎",g:"◆",c:"#5ee6e6"}};
let SV={bank:0,lvl:1,up:[0,0,0],cur:"egp",lang:(navigator.language||"").startsWith("ar")?"ar":"en"};
try{Object.assign(SV,JSON.parse(localStorage.getItem("moneyrun3d")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("moneyrun3d",JSON.stringify(SV))}catch(e){}};
const fmt=n=>Math.round(n).toLocaleString(SV.lang==="ar"?"ar-EG":"en-US");
const cost=i=>Math.round([150,300,600][i]*Math.pow(1.7,SV.up[i]));

/* ---------- three.js ---------- */
const cv=$("c"),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2.5));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(0x8fd3ff);S.fog=new THREE.Fog(0x8fd3ff,28,95);
const cam=new THREE.PerspectiveCamera(60,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x6a8fb0,.95));
const sun=new THREE.DirectionalLight(0xffffff,.85);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:26,bottom:-26,near:1,far:70});S.add(sun,sun.target);
const water=new THREE.Mesh(new THREE.PlaneGeometry(400,900),new THREE.MeshStandardMaterial({color:0x2f9be0,roughness:.35,metalness:.1}));
water.rotation.x=-Math.PI/2;water.position.y=-1.2;S.add(water);
const LV=new THREE.Group();S.add(LV);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<.8?78:60;cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

/* player */
const P=new THREE.Group(),body=new THREE.Group();P.add(body);
const mk=(g,c,x,y,z)=>{const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,roughness:.5}));m.position.set(x,y,z);m.castShadow=true;body.add(m);return m};
mk(new THREE.CylinderGeometry(.34,.4,.9,20),0xff6b35,0,.75,0);
mk(new THREE.SphereGeometry(.34,24,18),0xffd7a8,0,1.5,0);
mk(new THREE.SphereGeometry(.36,24,12,0,Math.PI*2,0,Math.PI/2),0x2a6fdb,0,1.56,0);
mk(new THREE.CylinderGeometry(.13,.13,.55,12),0x23395b,-.17,.28,0);
mk(new THREE.CylinderGeometry(.13,.13,.55,12),0x23395b,.17,.28,0);
const stk=new THREE.Group();stk.position.set(0,0,.75);P.add(stk);
const discs=[];S.add(P);
let coinGeo=new THREE.CylinderGeometry(.35,.35,.1,28),coinMats=[],coinGeoStk=new THREE.CylinderGeometry(.42,.42,.12,28);

function coinMaterials(){
  const C=CUR[SV.cur],k=document.createElement("canvas");k.width=k.height=128;const x=k.getContext("2d");
  x.fillStyle=C.c;x.fillRect(0,0,128,128);x.strokeStyle="rgba(0,0,0,.35)";x.lineWidth=8;x.beginPath();x.arc(64,64,52,0,7);x.stroke();
  x.fillStyle="#3a2a00";x.font="bold 70px Cairo,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(C.g,64,70);
  const t=new THREE.CanvasTexture(k);t.anisotropy=8;
  return[new THREE.MeshStandardMaterial({color:C.c,metalness:.7,roughness:.3}),new THREE.MeshStandardMaterial({map:t,metalness:.5,roughness:.35}),new THREE.MeshStandardMaterial({map:t,metalness:.5,roughness:.35})];
}
function label(txt,col,w=256,h=128){
  const k=document.createElement("canvas");k.width=w;k.height=h;const x=k.getContext("2d");
  x.fillStyle=col;x.fillRect(0,0,w,h);x.fillStyle="#fff";x.font="800 "+(h*.62)+"px Cairo,sans-serif";x.textAlign="center";x.textBaseline="middle";
  x.fillText(txt,w/2,h/2+4);const t=new THREE.CanvasTexture(k);t.anisotropy=8;return t;
}

/* game state */
let coins=[],gates=[],obs=[],Ln=160,pz=0,px=0,tx=0,money=100,sp=11,state="menu",tm=0,startMoney=100,coinVal=10,lastT=0;
const GOOD=[["+",50],["+",100],["×",2],["×",1.5]],BAD=[["−",40],["−",80],["÷",2]];
const pick=a=>a[Math.random()*a.length|0];
const isGood=c=>c[0]==="+"||c[0]==="×";

function build(){
  while(LV.children.length)LV.remove(LV.children[0]);
  coins=[];gates=[];obs=[];coinMats=coinMaterials();
  Ln=Math.min(320,140+SV.lvl*20);
  const pal=[[0xffd166,0xffc24b],[0x8ee6c0,0x6fd6a9],[0xffa8c5,0xff8fb4],[0xb9a7ff,0xa08cff]][SV.lvl%4];
  const len=Ln+60,cz=(10-Ln-50)/2;
  const k=document.createElement("canvas");k.width=k.height=128;const x=k.getContext("2d");
  x.fillStyle="#"+pal[0].toString(16);x.fillRect(0,0,128,128);x.fillStyle="#"+pal[1].toString(16);x.fillRect(0,0,64,64);x.fillRect(64,64,64,64);
  const rt=new THREE.CanvasTexture(k);rt.wrapS=rt.wrapT=THREE.RepeatWrapping;rt.repeat.set(5,len/2);rt.anisotropy=8;
  const road=new THREE.Mesh(new THREE.BoxGeometry(10,1,len),new THREE.MeshStandardMaterial({map:rt,roughness:.7}));
  road.position.set(0,-.5,cz);road.receiveShadow=true;LV.add(road);
  const wm=new THREE.MeshStandardMaterial({color:0x2a6fdb,roughness:.45});
  const n=Math.floor(len/1.2),studs=new THREE.InstancedMesh(new THREE.CylinderGeometry(.26,.26,.18,16),wm,n*2),d=new THREE.Object3D();
  [-1,1].forEach((s,j)=>{
    const w=new THREE.Mesh(new THREE.BoxGeometry(.9,1.6,len),wm);w.position.set(s*5.45,.8,cz);w.castShadow=true;w.receiveShadow=true;LV.add(w);
    for(let i=0;i<n;i++){d.position.set(s*5.45,1.7,cz-len/2+i*1.2+.6);d.updateMatrix();studs.setMatrixAt(j*n+i,d.matrix)}
  });
  LV.add(studs);
  for(let z=-26;z>-Ln+8;z-=15){
    const r=Math.random(),pb=Math.min(.7,.45+SV.lvl*.03);
    if(r<.38)coinRow(z);
    else if(r<.74){
      const L=Math.random()<pb?pick(BAD):pick(GOOD),Rr=Math.random()<pb?pick(BAD):pick(GOOD);
      const c=Math.random()<.5?[pick(GOOD),Rr]:[L,pick(GOOD)];gateRow(z,c[0],c[1]);
    }else obstacle(z);
  }
  /* finish */
  const fk=document.createElement("canvas");fk.width=512;fk.height=32;const f=fk.getContext("2d");
  for(let i=0;i<32;i++)for(let j=0;j<2;j++){f.fillStyle=(i+j)%2?"#111":"#fff";f.fillRect(i*16,j*16,16,16)}
  const ft=new THREE.CanvasTexture(fk);ft.magFilter=THREE.NearestFilter;
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(10,1),new THREE.MeshBasicMaterial({map:ft}));fl.rotation.x=-Math.PI/2;fl.position.set(0,.02,-Ln);LV.add(fl);
  const arch=new THREE.Mesh(new THREE.BoxGeometry(10.8,2,.6),new THREE.MeshStandardMaterial({map:label(T[SV.lang].fin,"#e63946",512,128)}));
  arch.position.set(0,6,-Ln);arch.scale.y=1;LV.add(arch);
  [-5,5].forEach(s=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.6,6,.6),new THREE.MeshStandardMaterial({color:0xffffff}));p.position.set(s,3,-Ln);LV.add(p)});
}
function addCoin(x,z){
  const g=new THREE.Group(),m=new THREE.Mesh(coinGeo,coinMats);m.rotation.x=Math.PI/2;m.castShadow=true;g.add(m);
  g.position.set(x,.9,z);LV.add(g);coins.push({m:g,x,z,got:false});
}
function coinRow(z){const x0=(Math.random()-.5)*4.4;for(let i=0;i<7;i++)addCoin(Math.max(-4,Math.min(4,x0+Math.sin(i*.7)*1.3)),z-i*1.1)}
function gateRow(z,l,r){
  const g={z,L:l,R:r,done:false};
  [[l,-2.5],[r,2.5]].forEach(([c,x])=>{
    const good=isGood(c),col=good?"#1f9d55":"#c0392b";
    const panel=new THREE.Mesh(new THREE.BoxGeometry(4.6,3.4,.25),new THREE.MeshStandardMaterial({color:good?0x2ecc71:0xe74c3c,transparent:true,opacity:.55,roughness:.3}));
    panel.position.set(x,1.7,z);LV.add(panel);
    const tag=new THREE.Mesh(new THREE.PlaneGeometry(3.2,1.6),new THREE.MeshBasicMaterial({map:label(c[0]+c[1],col)}));
    tag.position.set(x,2,z+.15);LV.add(tag);
  });
  gates.push(g);
}
function obstacle(z){
  const x=pick([-2.4,0,2.4]),g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(3.2,1,.7),new THREE.MeshStandardMaterial({color:0xe63946,roughness:.5}));b.position.y=.5;b.castShadow=true;g.add(b);
  for(let i=-2;i<=2;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.2,.5,10),new THREE.MeshStandardMaterial({color:0xf1f1f1}));s.position.set(i*.6,1.25,0);s.castShadow=true;g.add(s)}
  g.position.set(x,0,z);LV.add(g);obs.push({m:g,x,z,done:false});
  const o=x>0?-2.4:2.4;for(let i=0;i<4;i++)addCoin(o,z-i*1.1);
}
function stackUpdate(){
  const n=Math.min(24,Math.floor(Math.log2(money/60+1)*4));
  while(discs.length<24){const m=new THREE.Mesh(coinGeoStk,coinMats.length?coinMats:coinMaterials());m.position.y=.3+discs.length*.13;stk.add(m);discs.push(m)}
  discs.forEach((m,i)=>{m.visible=i<n;m.material=coinMats})
}

/* ---------- gameplay ---------- */
function pop(t,good){const p=$("pop");p.textContent=t;p.className="";void p.offsetWidth;p.className=good?"good":"bad"}
function apply(c){
  const b=money;
  if(c[0]==="+")money+=c[1];else if(c[0]==="−")money=Math.max(0,money-c[1]);
  else if(c[0]==="×")money=Math.round(money*c[1]);else money=Math.round(money/c[1]);
  pop(c[0]+c[1],money>=b);
}
function start(){
  startMoney=100+100*SV.up[0];coinVal=10+5*SV.up[1];
  build();money=startMoney;pz=0;px=0;tx=0;sp=11+Math.min(6,SV.lvl*.4);tm=0;state="play";
  $("ov").style.display="none";$("lv").textContent=T[SV.lang].lvl+" "+fmt(SV.lvl);
}
function finish(){
  state="over";const bonus=Math.floor(money*.25*SV.up[2]),total=money+bonus;
  SV.bank+=total;SV.lvl++;save();
  const t=T[SV.lang];
  menu(t.done,t.earned+": "+fmt(money)+" "+CUR[SV.cur].s+(bonus?" + "+t.bonus+": "+fmt(bonus):""),true);
}
function update(dt){
  tm+=dt;pz-=sp*dt;px+=(tx-px)*Math.min(1,dt*10);
  P.position.set(px,0,pz);body.position.y=Math.abs(Math.sin(tm*11))*.14;body.rotation.z=(tx-px)*-.08;
  for(const c of coins){
    if(c.got)continue;c.m.rotation.y+=dt*4;
    if(Math.abs(c.z-pz)<.8&&Math.abs(c.x-px)<.95){c.got=true;c.m.visible=false;money+=coinVal}
  }
  for(const g of gates)if(!g.done&&pz<g.z){g.done=true;apply(px<0?g.L:g.R)}
  for(const o of obs)if(!o.done&&Math.abs(o.z-pz)<.8&&Math.abs(o.x-px)<1.9){o.done=true;money=Math.floor(money*.8);pop("−20%",false);o.m.rotation.z=.4}
  if(pz<-Ln)finish();
  $("mo").textContent=fmt(money)+" "+CUR[SV.cur].s;$("pb").style.width=Math.min(100,-pz/Ln*100)+"%";
}
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(state==="play")update(dt);else{tm+=dt;P.position.set(0,0,pz);body.position.y=0}
  stackUpdate();
  cam.position.set(px*.6,5.6,pz+8.2);cam.lookAt(px*.6,1.1,pz-7);
  sun.position.set(7,16,pz+8);sun.target.position.set(0,0,pz-8);sun.target.updateMatrixWorld();
  R.render(S,cam);requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const clampX=v=>Math.max(-4,Math.min(4,v));
addEventListener("pointermove",e=>{if(state==="play")tx=clampX((e.clientX/innerWidth-.5)*9)});
addEventListener("pointerdown",e=>{if(state==="play")tx=clampX((e.clientX/innerWidth-.5)*9)});
addEventListener("keydown",e=>{if(state!=="play")return;const L=e.key==="ArrowLeft"||e.key==="a",Rr=e.key==="ArrowRight"||e.key==="d";if(L)tx=clampX(tx-1.4);if(Rr)tx=clampX(tx+1.4)});

/* ---------- menu ---------- */
function fitCard(){const c=$("card");c.style.transform="none";const s=Math.min(1,(innerHeight-48)/c.offsetHeight,(innerWidth-20)/c.offsetWidth);c.style.transform="scale("+s+")"}
addEventListener("resize",fitCard);
function menu(title,sub,after){
  const t=T[SV.lang];document.documentElement.lang=SV.lang;document.documentElement.dir=SV.lang==="ar"?"rtl":"ltr";document.title="Make Money";
  $("card").innerHTML=
   "<img id='logo' alt='' style='width:84px;height:84px;border-radius:50%;margin:0 auto;border:3px solid var(--gold);object-fit:cover' src='"+document.querySelector("link[rel=icon]").href+"'><h1>"+title+"</h1><p>"+sub+"</p>"+
   "<div class='row'>"+[["ar","العربية"],["en","English"]].map(l=>"<button class='chip"+(SV.lang===l[0]?" on":"")+"' data-l='"+l[0]+"'>"+l[1]+"</button>").join("")+"</div>"+
   "<div class='row'>"+Object.keys(CUR).map(k=>"<button class='chip"+(SV.cur===k?" on":"")+"' data-c='"+k+"'>"+t.cn[k]+"</button>").join("")+"</div>"+
   "<b>"+t.bank+": "+fmt(SV.bank)+" "+CUR[SV.cur].s+"</b>"+
   "<div class='shop'>"+t.it.map((it,i)=>"<div class='it'><span class='e'>"+it[0]+"</span><div><b>"+it[1]+" · "+t.lv+" "+fmt(SV.up[i])+"</b><br><small>"+it[2]+"</small></div><button class='buy' data-u='"+i+"'"+(SV.bank<cost(i)?" disabled":"")+">"+t.buy+" "+fmt(cost(i))+"</button></div>").join("")+"</div>"+
   "<small>"+t.hint+"</small><button id='go'>"+(after?t.next:t.play)+"</button>";
  $("ov").style.display="flex";fitCard();
  $("card").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{SV.lang=b.dataset.l;save();menu(T[SV.lang].title,T[SV.lang].tag,after)});
  $("card").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{SV.cur=b.dataset.c;save();coinMats=coinMaterials();menu(title,sub,after)});
  $("card").querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(SV.bank>=cost(i)){SV.bank-=cost(i);SV.up[i]++;save();menu(title,sub,after)}});
  $("go").onclick=start;
}
build();coinMats=coinMaterials();$("lv").textContent="";
menu(T[SV.lang].title,T[SV.lang].tag,false);
requestAnimationFrame(t=>{lastT=t;frame(t)});
</script>
</body>
</html>
